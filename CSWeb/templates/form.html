<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleep & School Life Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:   #4a7fff;
    --purple: #9b5fff;
    --teal:   #00d4aa;
    --pink:   #ff5fa0;
    --amber:  #ffb347;
    --bg:     #07080f;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: #fff;
    padding: 3rem 1rem 4rem;
    overflow-x: hidden;
  }

  /* ── ambient orbs ── */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(74,127,255,.18) 0%, transparent 70%);
    top: -150px; left: -150px;
  }
  body::after {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(155,95,255,.14) 0%, transparent 70%);
    bottom: -100px; right: -100px;
  }

  .orb-teal {
    position: fixed;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,212,170,.1) 0%, transparent 70%);
    filter: blur(80px);
    top: 40%; left: 60%;
    pointer-events: none;
    z-index: 0;
  }

  /* ── wrapper ── */
  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
  }

  /* ── header ── */
  .header {
    margin-bottom: 2rem;
    animation: fadeUp .6s ease both;
  }
  .header-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(74,127,255,.12);
    border: 1px solid rgba(74,127,255,.25);
    border-radius: 100px;
    padding: 4px 14px;
    font-size: .7rem;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 1rem;
  }
  .header-pill span { width:6px; height:6px; border-radius:50%; background:var(--blue); display:inline-block; animation: pulse 2s infinite; }
  h2 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 700;
    line-height: 1.15;
    background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,.5));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: .4rem;
  }
  .header p {
    color: rgba(255,255,255,.38);
    font-size: .85rem;
    font-weight: 300;
  }

  /* ── card ── */
  .card {
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    padding: 2rem 2rem 1.5rem;
    margin-bottom: 1.25rem;
    position: relative;
    overflow: hidden;
    animation: fadeUp .6s ease both;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.03) 0%, transparent 60%);
    pointer-events: none;
  }

  /* card color accent top-bar */
  .card[data-color="blue"]   { border-top: 2px solid rgba(74,127,255,.5); }
  .card[data-color="purple"] { border-top: 2px solid rgba(155,95,255,.5); }
  .card[data-color="teal"]   { border-top: 2px solid rgba(0,212,170,.5); }
  .card[data-color="pink"]   { border-top: 2px solid rgba(255,95,160,.5); }

  /* section header */
  h3 {
    font-family: 'Syne', sans-serif;
    font-size: .65rem;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card[data-color="blue"]   h3 { color: var(--blue); }
  .card[data-color="purple"] h3 { color: var(--purple); }
  .card[data-color="teal"]   h3 { color: var(--teal); }
  .card[data-color="pink"]   h3 { color: var(--pink); }

  h3::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,.06);
  }

  /* ── grid layouts ── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
  .field  { display: flex; flex-direction: column; gap: 6px; margin-bottom: .75rem; }
  .field:last-child { margin-bottom: 0; }

  /* ── labels ── */
  label {
    font-size: .75rem;
    font-weight: 400;
    color: rgba(255,255,255,.45);
    letter-spacing: .02em;
  }

  /* ── inputs ── */
  input[type="text"],
  input[type="time"],
  input[type="number"],
  select {
    width: 100%;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 10px;
    color: #fff;
    font-size: .875rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    padding: .6rem .875rem;
    transition: border-color .2s, background .2s, box-shadow .2s;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
  }
  input::placeholder { color: rgba(255,255,255,.18); }

  /* focus colors per section */
  .card[data-color="blue"]   input:focus,
  .card[data-color="blue"]   select:focus {
    border-color: rgba(74,127,255,.6);
    background: rgba(74,127,255,.08);
    box-shadow: 0 0 0 3px rgba(74,127,255,.12);
  }
  .card[data-color="purple"] input:focus,
  .card[data-color="purple"] select:focus {
    border-color: rgba(155,95,255,.6);
    background: rgba(155,95,255,.08);
    box-shadow: 0 0 0 3px rgba(155,95,255,.12);
  }
  .card[data-color="teal"]   input:focus,
  .card[data-color="teal"]   select:focus {
    border-color: rgba(0,212,170,.6);
    background: rgba(0,212,170,.08);
    box-shadow: 0 0 0 3px rgba(0,212,170,.12);
  }
  .card[data-color="pink"]   input:focus,
  .card[data-color="pink"]   select:focus {
    border-color: rgba(255,95,160,.6);
    background: rgba(255,95,160,.08);
    box-shadow: 0 0 0 3px rgba(255,95,160,.12);
  }

  /* select arrow */
  .sel-wrap { position: relative; }
  .sel-wrap::after {
    content: '';
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid rgba(255,255,255,.3);
    pointer-events: none;
  }
  .sel-wrap select { padding-right: 2rem; }
  select option { background: #111322; color: #fff; }

  /* ── submit ── */
  .submit-wrap {
    margin-top: 1.5rem;
    animation: fadeUp .7s .1s ease both;
  }
  input[type="submit"] {
    width: 100%;
    background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 50%, var(--pink) 100%);
    background-size: 200% 200%;
    animation: gradShift 4s ease infinite;
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: .9375rem;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    letter-spacing: .04em;
    padding: .9rem;
    cursor: pointer;
    transition: transform .15s, opacity .15s;
    box-shadow: 0 4px 32px rgba(74,127,255,.3), 0 0 0 1px rgba(255,255,255,.08) inset;
  }
  input[type="submit"]:hover  { transform: translateY(-2px); opacity: .92; }
  input[type="submit"]:active { transform: translateY(0); opacity: 1; }

  /* ── animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: .3; }
  }
  @keyframes gradShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card:nth-child(2) { animation-delay: .05s; }
  .card:nth-child(3) { animation-delay: .10s; }
  .card:nth-child(4) { animation-delay: .15s; }
  .card:nth-child(5) { animation-delay: .20s; }

  @media (max-width: 520px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .card { padding: 1.5rem 1.25rem; }
  }
</style>
</head>
<body>

<div class="orb-teal"></div>

<div class="wrapper">

  <div class="header">
    <div class="header-pill"><span></span> Student Wellness Study</div>
    <h2>Sleep &amp; School Life Survey</h2>
    <p>Completely anonymous — takes about 2 minutes.</p>
  </div>

  <form action="export_csv" method="get">

    <div class="card" data-color="blue">
      <h3>About You</h3>
      <div class="grid-2">
        <div class="field">
          <label for="fname">First name</label>
          <input type="text" id="fname" name="fname">
        </div>
        <div class="field">
          <label for="lname">Last name</label>
          <input type="text" id="lname" name="lname">
        </div>
        <div class="field">
          <label for="grade">Grade</label>
          <div class="sel-wrap">
            <select id="grade" name="grade">
              <option value="">Select...</option>
              <option>9th</option>
              <option>10th</option>
              <option>11th</option>
              <option>12th</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="gender">Gender</label>
          <div class="sel-wrap">
            <select id="gender" name="gender">
              <option value="">Select...</option>
              <option>Male</option>
              <option>Female</option>
              <option></option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card" data-color="purple">
      <h3>Sleep Habits</h3>
      <div class="grid-2">
        <div class="field">
          <label for="bedtime">Average bedtime on school night</label>
          <input type="time" id="bedtime" name="bedtime" value="23:00">
        </div>
        <div class="field">
          <label for="wakeup">Average wake-up time on school day</label>
          <input type="time" id="wakeup" name="wakeup" value="07:00">
        </div>
        <div class="field">
          <label for="weekend_shift">Weekend sleep shift (hours later than school night)</label>
          <input type="number" id="weekend_shift" name="weekend_shift" min="0" max="8" step="0.5" placeholder="e.g. 1.5">
        </div>
        <div class="field">
          <label for="sleep_quality">Sleep quality (1 = poor, 5 = excellent)</label>
          <div class="sel-wrap">
            <select id="sleep_quality" name="sleep_quality">
              <option value="">Select...</option>
              <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card" data-color="teal">
      <h3>Academics</h3>
      <div class="grid-3">
        <div class="field">
          <label for="gpa">GPA (estimated)</label>
          <div class="sel-wrap">
            <select id="gpa" name="gpa">
              <option value="">Select...</option>
              <option>4.0+</option>
              <option>3.5–3.9</option>
              <option>3.0–3.4</option>
              <option>2.5–2.9</option>
              <option>Below 2.5</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="honors">Number of Honors/advanced courses</label>
          <div class="sel-wrap">
            <select id="honors" name="honors">
              <option value="">Select...</option>
              <option>None</option><option>1–2</option><option>3–4</option><option>5+</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="tired">How often do you feel too tired to focus in class?</label>
          <div class="sel-wrap">
            <select id="tired" name="tired">
              <option value="">Select...</option>
              <option>Never</option><option>Rarely</option><option>Sometimes</option><option>Often</option><option>Always</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card" data-color="pink">
      <h3>Extracurriculars &amp; Lifestyle</h3>
      <div class="grid-2">
        <div class="field">
          <label for="sports">Varsity/JV sports</label>
          <div class="sel-wrap">
            <select id="sports" name="sports">
              <option value="">Select...</option>
              <option>None</option><option>1 sport</option><option>2 sports</option><option>3+</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="clubs">Clubs/activities</label>
          <div class="sel-wrap">
            <select id="clubs" name="clubs">
              <option value="">Select...</option>
              <option>None</option><option>1–2</option><option>3–4</option><option>5+</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="screen_time">Average screen time before bed (minutes)</label>
          <input type="number" id="screen_time" name="screen_time" min="0" max="300" placeholder="e.g. 30">
        </div>
        <div class="field">
          <label for="caffeine">Average caffeine drinks per day</label>
          <div class="sel-wrap">
            <select id="caffeine" name="caffeine">
              <option value="">Select...</option>
              <option>0</option><option>1</option><option>2</option><option>3+</option>
            </select>
          </div>
        </div>
      </div>
      <div class="field" style="margin-top:.25rem">
        <label for="mood">Average mood on school days (1 = low, 5 = great)</label>
        <div class="sel-wrap">
          <select id="mood" name="mood">
            <option value="">Select...</option>
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
          </select>
        </div>
      </div>
    </div>

    <div class="submit-wrap">
      <input type="submit" value="Submit Survey">
    </div>

  </form>

</div>

</body>
</html>
